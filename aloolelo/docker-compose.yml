version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      # Use the db service name as the host
      - DATABASE_URL=postgresql://postgres:password123@db:5432/innova?schema=public
      # Add other environment variables here (e.g., OPENAI_API_KEY)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - innova-network

  db:
    # We use a Postgres image that comes with pgvector pre-installed
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=innova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - innova-network

volumes:
  pgdata:

networks:
  innova-network:
